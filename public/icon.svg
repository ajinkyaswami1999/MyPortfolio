<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Ki Aura Glow -->
    <radialGradient id="kiAura" cx="50%" cy="50%" r="50%">
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Dragon Ball Crystal Body -->
    <radialGradient id="dragonBallBody" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>

    <!-- Top-Left Glass Specular Sheen -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Rim Ambient Glow -->
    <radialGradient id="bottomRim" cx="50%" cy="92%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0"/>
    </radialGradient>

    <!-- Star Shading Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Drop Shadow for Crystal Depth -->
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.6" dy="0.8" stdDeviation="0.4" flood-color="#78350F" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Ki Halo Ring -->
  <circle cx="32" cy="32" r="31" fill="url(#kiAura)"/>

  <!-- Dark Crystal Outline / Depth Rim -->
  <circle cx="32" cy="32" r="28" fill="#78350F"/>

  <!-- Amber Crystal Sphere Core -->
  <circle cx="32" cy="32" r="26.5" fill="url(#dragonBallBody)"/>

  <!-- Bottom Rim Ambient Light Reflection -->
  <circle cx="32" cy="32" r="26.5" fill="url(#bottomRim)"/>

  <!-- 4 Crimson 5-Point Stars in Iconic Dragon Ball Diamond Alignment -->
  <g filter="url(#starShadow)" fill="url(#starGrad)" stroke="#7F1D1D" stroke-width="0.3">
    <!-- Top Star (Center: x=32, y=21.5) -->
    <polygon points="32,17.5 33.3,21.0 37.0,21.2 34.1,23.5 35.0,27.0 32,25.1 29.0,27.0 29.9,23.5 27.0,21.2 30.7,21.0"/>
    <!-- Bottom Star (Center: x=32, y=42.5) -->
    <polygon points="32,38.5 33.3,42.0 37.0,42.2 34.1,44.5 35.0,48.0 32,46.1 29.0,48.0 29.9,44.5 27.0,42.2 30.7,42.0"/>
    <!-- Left Star (Center: x=21.5, y=32) -->
    <polygon points="21.5,28.0 22.8,31.5 26.5,31.7 23.6,34.0 24.5,37.5 21.5,35.6 18.5,37.5 19.4,34.0 16.5,31.7 20.2,31.5"/>
    <!-- Right Star (Center: x=42.5, y=32) -->
    <polygon points="42.5,28.0 43.8,31.5 47.5,31.7 44.6,34.0 45.5,37.5 42.5,35.6 39.5,37.5 40.4,34.0 37.5,31.7 41.2,31.5"/>
  </g>

  <!-- 3D Specular Curved Glass Glare -->
  <ellipse cx="23" cy="18" rx="10" ry="5.5" transform="rotate(-30 23 18)" fill="url(#specularGlow)"/>
  <circle cx="36" cy="46" r="2.2" fill="#FFFFFF" opacity="0.35"/>
</svg>